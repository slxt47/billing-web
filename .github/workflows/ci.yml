name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    name: Backend-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Abhängigkeiten installieren
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Tests
        working-directory: backend
        run: python -m pytest

  frontend-tests:
    name: Frontend-Tests (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: jsdom installieren
        working-directory: backend/tests/frontend
        run: npm install --no-audit --no-fund

      - name: Tests
        working-directory: backend/tests/frontend
        run: npm test

  static-checks:
    name: Syntax-Prüfungen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python kompilieren
        run: python -m compileall -q backend/app

      - name: Shell-Skripte prüfen
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          if command -v shellcheck >/dev/null; then shellcheck -S warning scripts/*.sh || true; fi

      - name: JavaScript prüfen
        run: |
          for f in backend/app/static/*.js; do node --check "$f"; done

  docker-build:
    name: Container-Image bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image bauen
        run: docker build -t rechnung-app:ci ./backend

      - name: Läuft nicht als root
        run: |
          uid="$(docker run --rm --entrypoint id rechnung-app:ci -u)"
          echo "Container-UID: $uid"
          test "$uid" != "0"

      - name: docker-compose.yml validieren
        run: docker compose -f docker-compose.yml config >/dev/null

      # Das nginx-Image ueberspringt .envsh-Dateien ohne Ausfuehrungsrecht
      # stillschweigend - dann bliebe ${NGINX_LOG_LEVEL} unersetzt stehen und
      # beide nginx starten nicht mehr. Genau so ist es beim Umbau passiert.
      - name: nginx-Hilfsskript ist ausfuehrbar
        run: test -x nginx/05-log-level.envsh

      - name: nginx-Konfiguration pruefen
        run: |
          # Der Proxy braucht ein Zertifikat, sonst scheitert schon der
          # Syntaxtest. nginx:alpine bringt kein openssl mit, also hier erzeugen.
          mkdir -p /tmp/certs
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout /tmp/certs/localhost.key -out /tmp/certs/localhost.crt \
            -subj "/CN=localhost" 2>/dev/null
          for tpl in nginx/*.conf.template; do
            name="$(basename "$tpl" .template)"
            echo "== $name"
            docker run --rm \
              -e LOG_LEVEL=INFO \
              -e NGINX_ENVSUBST_FILTER='^(LOG_LEVEL|NGINX_)' \
              -v "$PWD/$tpl:/etc/nginx/templates/$name.template:ro" \
              -v "$PWD/nginx/05-log-level.envsh:/docker-entrypoint.d/05-log-level.envsh:ro" \
              -v /tmp/certs:/etc/nginx/certs:ro \
              --entrypoint /docker-entrypoint.sh nginx:alpine nginx -t
          done
