<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anmelden – Rechnungs-App</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" href="/static/favicon.ico">
</head>
<body class="login-page">
  <form class="login-card" method="post" action="/login">
    <h1>🧾 Rechnungs-App</h1>
    <p class="hint">Bitte anmelden</p>

    <label>Benutzername
      <input type="text" name="username" autocomplete="username" required autofocus>
    </label>
    <label>Passwort
      <input type="password" name="password" autocomplete="current-password" required>
    </label>

    <button type="submit" class="primary">Anmelden</button>
    <p id="login-error" class="err">Benutzername oder Passwort falsch.</p>
    <p id="login-locked" class="err"></p>
  </form>

  <script>
    const params = new URLSearchParams(location.search);
    if (params.get("error")) {
      document.getElementById("login-error").style.display = "block";
    }
    const locked = parseInt(params.get("locked"), 10);
    if (locked > 0) {
      const mins = Math.ceil(locked / 60);
      const el = document.getElementById("login-locked");
      el.textContent = `Zu viele Fehlversuche. Bitte in ca. ${mins} Minute${mins === 1 ? "" : "n"} erneut versuchen.`;
      el.style.display = "block";
      document.querySelector(".login-card button[type=submit]").disabled = true;
    }
  </script>
</body>
</html>
