<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anmelden – Rechnungs-App</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" href="/static/favicon.ico">
</head>
<body class="login-page">
  <form class="login-card" method="post" action="/login">
    <input type="hidden" name="csrf_token" id="csrf-token" value="">
    <h1>🧾 Rechnungs-App</h1>
    <p class="hint">Bitte anmelden</p>

    <label>Benutzername
      <input type="text" name="username" autocomplete="username" required autofocus>
    </label>
    <label>Passwort
      <input type="password" name="password" autocomplete="current-password" required>
    </label>

    <button type="submit" class="primary">Anmelden</button>
    <p id="login-error" class="err">Benutzername oder Passwort falsch.</p>
    <p id="login-locked" class="err"></p>
  </form>

  <script src="/static/login.js"></script>
</body>
</html>
